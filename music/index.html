<!DOCTYPE html>
<html lang="en">
<head>
<link rel="icon" type="image/png" href="../images/favicon/dissectyourselflogo.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>

/* House icon */
.house-icon {
  position: relative; width: 22px; height: 18px; margin-right: 6px;
  display: inline-block; vertical-align: middle; animation: floatPage 4s ease-in-out infinite;
}
.house-icon .body {
  position: absolute; bottom: 0; left: 3px; width: 16px; height: 12px;
  background: #111; border: 2px solid #c11717; box-shadow: inset 0 0 0 0.5px #c11717;
}
.house-icon::before {
  content: ''; position: absolute; top: -2px; left: 1px;
  width: 0; height: 0;
  border-left: 10px solid transparent; border-right: 10px solid transparent;
  border-bottom: 8px solid #c11717; transform: rotate(-1deg);
}
.house-icon .door { position: absolute; bottom: 0; left: 9px; width: 4px; height: 6px; background: #c11717; }

/* Page icon */
.page-icon {
  position: relative; width: 20px; height: 24px; background: #111;
  border: 2px solid #ffffff; border-radius: 2px; margin-right: 6px;
  display: inline-block; vertical-align: middle; box-shadow: inset 0 0 0 0.5px #ffffff;
  animation: floatPage 4s ease-in-out infinite;
}
.page-icon::before, .page-icon::after {
  content: ''; position: absolute; left: 3px; right: 3px; height: 2px;
  background: #ffffff; transform: rotate(-1deg);
}
.page-icon::before { top: 6px; }
.page-icon::after { top: 12px; }
.page-icon span { position: absolute; left: 3px; right: 3px; height: 2px; background: #ffffff; top: 18px; display: block; transform: rotate(1deg); }

/* Globe icon */
.globe-icon {
  position: relative; width: 24px; height: 24px; border: 2px solid #ff4c4c;
  border-radius: 50%; margin-right: 6px; display: inline-block; vertical-align: middle;
  background: #111; animation: floatPage 4s ease-in-out infinite;
}
.globe-icon::before {
  content: ''; position: absolute; top: 50%; left: 10%; right: 10%; height: 2px;
  background: #ff4c4c; transform: translateY(-50%);
}
.globe-icon::after {
  content: ''; position: absolute; left: 50%; top: 10%; bottom: 10%; width: 2px;
  background: #ff4c4c; transform: translateX(-50%); border-radius: 50%;
}
.globe-icon span { position: absolute; left: 15%; right: 15%; height: 1px; background: #ff4c4c; display: block; }
.globe-icon span:nth-child(1) { top: 30%; }
.globe-icon span:nth-child(2) { top: 70%; }

@keyframes floatPage {
  0%   { transform: translate(0px, 0px) rotate(0deg); }
  20%  { transform: translate(-1px, -2px) rotate(-0.5deg); }
  40%  { transform: translate(1px, -1px) rotate(0.3deg); }
  60%  { transform: translate(-1px, 1px) rotate(-0.2deg); }
  80%  { transform: translate(1px, 2px) rotate(0.5deg); }
  100% { transform: translate(0px, 0px) rotate(0deg); }
}

.site-header {
  display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 20px 20px;
}
.site-header > a { grid-column: 2; }
.site-header > .now-playing { grid-column: 3; justify-self: center; }
.site-header > a img {
  height: 200px; width: auto;
  filter: drop-shadow(0 0 8px rgba(255,0,0,0.4));
  animation: pulseGlow 3s ease-in-out infinite, glitch 4s infinite;
  position: relative; z-index: 2;
}
@keyframes fadeIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
@keyframes pulseGlow {
  0% { filter: drop-shadow(0 0 8px rgba(255,0,0,0.4)); }
  50% { filter: drop-shadow(0 0 16px rgba(255,0,0,0.9)); }
  100% { filter: drop-shadow(0 0 8px rgba(255,0,0,0.4)); }
}
@keyframes glitch {
  0% { transform: translate(0); }
  45% { transform: translate(0); }
  46% { transform: translate(-2px, 2px); }
  47% { transform: translate(2px, -2px); }
  48% { transform: translate(0); }
  75% { transform: scale(1); }
  76% { transform: scale(1.02); }
  77% { transform: scale(1); }
  100% { transform: translate(0); }
}
.site-header::after {
  content: ""; position: absolute; width: 100%; height: 160px; top: 0; left: 0;
  pointer-events: none;
  background: repeating-linear-gradient(to bottom, rgba(255,0,0,0.06) 0px, rgba(255,0,0,0.06) 2px, rgba(0,0,0,0) 3px);
  mix-blend-mode: overlay; animation: scan 9s linear infinite;
}
@keyframes scan { 0% { background-position-y: 0px; } 100% { background-position-y: 200px; } }

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; font-family: 'Share Tech Mono', monospace; font-weight: 400; background: #000; overflow-x: hidden; min-height: 100vh; }
@keyframes pageFadeIn { from { opacity: 0; } to { opacity: 1; } }

#grayscaleCanvas { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 0; }

.card {
  margin: 0; max-width: 100%; width: 100%; padding: 30px;
  background: rgba(0,0,0,0.85); border: 4px solid #880000; backdrop-filter: blur(8px);
  position: relative; z-index: 2;
}
@keyframes cardglow { 0%{box-shadow:0 0 80px #440000,inset 0 0 35px #220000;} 50%{box-shadow:0 0 100px #550000,inset 0 0 45px #330000;} 100%{box-shadow:0 0 80px #440000,inset 0 0 35px #220000;} }
@keyframes cardfloat { 0%{transform:translateY(0px);} 50%{transform:translateY(-6px);} 100%{transform:translateY(0px);} }

header h1 { font-size:60px; margin:0; text-align:center; letter-spacing:6px; font-weight:bold; text-shadow:2px 2px 15px #ff0000,-2px -2px 12px #220000; }

.tabs { display:flex; justify-content:center; gap:20px; margin:30px 0 20px 0; flex-wrap: wrap; }
.tab {
  position: relative; background: rgba(0,0,0,0.9); border:2px solid #880000; padding:14px 28px;
  cursor:pointer; font-weight:bold; color:#fff; letter-spacing:3px;
  display:flex; align-items:center; text-decoration: none;
  font-family: 'Share Tech Mono', monospace; font-size: 1rem;
  transition: transform 0.2s ease, box-shadow 0.2s ease;
}
.tab:hover { transform: scale(1.1) skewX(-5deg); }
.tab.active { background:#fff; color:#000; border-color:#ff0000; }
.tab span.text { position: relative; z-index: 1; }

@media (max-width: 600px) {
  .tabs { gap: 10px; }
  .tab { padding: 10px 18px; font-size: 14px; }
  header h1 { font-size:36px; }
  .card {
  margin: 0; max-width: 100%; width: 100%; padding: 30px;
  background: rgba(0,0,0,0.85); border: 4px solid #880000; backdrop-filter: blur(8px);
  position: relative; z-index: 2;
}
}

/* Panel content */
.panel-content { padding:25px; background:rgba(0,0,0,0.85); border:3px solid #660000; width:calc(100% - 60px); position:relative; color:#fff; margin:0 auto; }

/* Art text box */
.art-text {
  margin-top: 12px; color: #fff; font-size: 16px; line-height: 1.4; text-align: center;
  border: 2px solid #880000; border-radius: 6px; padding: 12px 16px;
  background: rgba(0,0,0,0.7); max-width: 90%; margin-left: auto; margin-right: auto;
  box-shadow: 0 0 15px rgba(136,0,0,0.5);
}

/* Art Modal */
.art-modal {
  position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 10001;
  opacity: 0; pointer-events: none; transition: opacity 0.3s ease;
  display: flex; align-items: center; justify-content: center; padding: 20px;
}
.art-modal.active { opacity: 1; pointer-events: auto; }
.art-modal-content {
  position: relative; width: 90vw; max-width: 1200px; max-height: 90vh;
  display: flex; flex-direction: column; align-items: stretch; justify-content: flex-start;
  text-align: center; background: rgba(0,0,0,0.95); border: 2px solid #880000;
  border-radius: 10px; padding: 10px 20px 20px 20px; overflow-y: auto;
  -webkit-overflow-scrolling: touch; box-sizing: border-box;
  transform: scale(0.8); opacity: 0; transition: transform 0.2s ease-out, opacity 0.2s ease-out;
}
.art-modal.active .art-modal-content { transform: scale(1); opacity: 1; }
.art-modal-content img { max-width: 100%; max-height: 70vh; object-fit: contain; display: block; margin: 0 auto 12px auto; border-radius: 4px; }
.art-modal-close { position: absolute; top: 10px; right: 15px; font-size: 28px; font-weight: bold; color: #fff; cursor: pointer; }

/* Grid */
.art-grid, .album-grid {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 20px; margin-top: 20px;
}
.art-card, .album-card, .art-item {
  position: relative; border: 2px solid #880000; padding: 10px; cursor: pointer;
  transition: transform 0.25s ease, box-shadow 0.25s ease;
  background: linear-gradient(180deg, rgba(0,0,0,0.65), rgba(0,0,0,0.5)); overflow: hidden;
}
.art-card:hover, .album-card:hover, .art-item:hover {
  transform: translateY(-6px) scale(1.02);
  box-shadow: 0 8px 30px rgba(0,0,0,0.6), 0 0 24px rgba(136,0,0,0.15);
}
.art-image, .album-image { width: 100%; height: auto; display: block; border: 2px solid #550000; border-radius: 4px; box-shadow: inset 0 0 20px rgba(0,0,0,0.6); }
.album-name { text-align: center; font-weight: bold; color: #fff; margin: 8px 0 4px 0; letter-spacing: 1px; }
.album-links { max-height: none; overflow: visible; padding: 6px 0; display: flex; flex-direction: column; gap: 6px; }
.album-links a { color: #ff7b7b; text-decoration: none; font-weight: bold; letter-spacing: 0.8px; padding: 6px 8px; display:flex; align-items: center; gap: 8px; border-radius: 3px; }
.album-links a svg { width: 18px; height: 18px; flex-shrink: 0; fill: currentColor; }
.album-links a i { font-size: 16px; width: 18px; text-align: center; flex-shrink: 0; }
.album-links a:hover { background: rgba(255,0,0,0.06); color: #ffb3b3; }

/* Boombox */
.boombox-container { margin-right:8px; }
.boombox { width:60px; height:40px; position: relative; transform-style: preserve-3d; transform-origin: center center; animation: rotate3d 4s linear infinite; }
.cube-face { position:absolute; box-sizing:border-box; border:2px solid #880000; }
.cube-front { width:60px; height:40px; background:#ff0000; transform: translateZ(20px); }
.cube-back  { width:60px; height:40px; background:#aa0000; transform: rotateY(180deg) translateZ(20px); }
.cube-left  { width:40px; height:40px; background:#bb0000; transform: rotateY(-90deg) translateZ(20px); }
.cube-right { width:40px; height:40px; background:#bb0000; transform: rotateY(90deg) translateZ(40px); }
.cube-top   { width:60px; height:40px; background:#cc0000; transform: rotateX(90deg) translateZ(20px); }
.cube-bottom { width:60px; height:40px; background:#880000; transform: rotateX(-90deg) translateZ(20px); }
.speaker { position:absolute; border-radius:50%; background:#000; width:12px; height:12px; }
.speaker.left { top:10px; left:6px; }
.speaker.right { top:10px; right:6px; }
.knob { position:absolute; width:3px; height:3px; background:#000; border-radius:50%; }
.knob.left { bottom:5px; left:10px; }
.knob.right { bottom:5px; right:10px; }
.led { width:4px; height:4px; background:yellow; border-radius:50%; position:absolute; top:6px; }
.led.left { left:8px; animation: blink1 0.9s infinite; }
.led.right { right:8px; animation: blink2 1.3s infinite; }
@keyframes blink1 {0%,100%{opacity:0.2;}50%{opacity:1;}}
@keyframes blink2 {0%,100%{opacity:0.2;}50%{opacity:1;}}
@keyframes rotate3d {0%{transform:rotateY(0deg) rotateX(5deg);}50%{transform:rotateY(180deg) rotateX(-5deg);}100%{transform:rotateY(360deg) rotateX(5deg);}}

/* Paintbrush */
.paint-container { margin-right:8px; }
.paintbrush { width:20px; height:40px; position:relative; transform-origin:center center; animation: brushrotate 2s linear infinite; }
.brush-handle { width:6px; height:30px; background:#8B4513; position:absolute; bottom:0; left:7px; border-radius:2px; }
.brush-tip { width:12px; height:10px; background:#FF0000; position:absolute; top:0; left:4px; border-radius:2px; }
@keyframes brushrotate {0%{transform:rotate(-10deg);}50%{transform:rotate(10deg);}100%{transform:rotate(-10deg);}}

/* Controller */
.controller-container { margin-right:8px; }
.controller { width:40px; height:25px; position:relative; transform-origin:center center; animation: controllerSpin 3s linear infinite; }
.controller-body { width:40px; height:25px; background:#222; border-radius:12px; position:absolute; top:0; left:0; }
.controller-button { width:4px; height:4px; border-radius:50%; position:absolute; }
.controller-button.triangle { top:5px; left:30px; background:#0f0; }
.controller-button.circle   { top:10px; left:35px; background:#f00; }
.controller-button.cross    { top:15px; left:30px; background:#00f; }
.controller-button.square   { top:10px; left:25px; background:#ff0; }
@keyframes controllerSpin {0%{transform:rotateY(0deg) rotateX(3deg);}50%{transform:rotateY(180deg) rotateX(-3deg);}100%{transform:rotateY(360deg) rotateX(3deg);}}

.front-intro { text-align:center; margin-top:30px; font-size:20px; line-height:1.6; }
.front-intro span.highlight { color:#ff4c4c; font-weight:bold; }

/* Worldbuilding */
#worldControls { display: flex; gap: 12px; justify-content: center; margin-bottom: 20px; }
#worldSearchToggle {
  background: rgba(0,0,0,0.9); border: 2px solid #880000; color: #fff;
  padding: 10px 22px; font-family: 'Share Tech Mono', monospace; letter-spacing: 3px;
  cursor: pointer; transition: transform 0.2s ease, box-shadow 0.2s ease;
}
#worldSearchToggle:hover { transform: scale(1.08) skewX(-5deg); box-shadow: 0 0 20px rgba(255,0,0,0.4); }
#worldSearch {
  width: 260px; padding: 10px 14px; background: rgba(0,0,0,0.85); border: 2px solid #880000;
  color: #fff; letter-spacing: 2px; outline: none; font-family: 'Share Tech Mono', monospace;
}
.az-header {
  grid-column: 1 / -1; font-size: 22px; letter-spacing: 6px; margin: 30px 0 10px 0;
  color: #ff4c4c; border-bottom: 2px solid #660000; padding-bottom: 6px;
  text-shadow: 0 0 12px rgba(255,0,0,0.4);
}
.world-item { text-align: center; }
.world-item h3 { letter-spacing: 3px; margin: 20px 0; text-shadow: 0 0 10px rgba(255,0,0,0.4); }


/* Chains — attached to top corners of the card */
.chain-left, .chain-right {
  position: absolute;
  width: 350px;
  height: 350px;
  background: url('../images/chains.png') top right / contain no-repeat;
  pointer-events: none;
  z-index: 1;
  opacity: 1;
  
  
}
.chain-left  { left: 0; top: 40px; transform: translateX(-100%); }
.chain-right { right: 0; top: 40px; transform: translateX(100%) scaleX(-1); background-position: top left; }



/* Trophy icon */
.trophy-icon {
  position: relative; width: 22px; height: 22px; margin-right: 6px;
  display: inline-block; vertical-align: middle; animation: floatPage 4s ease-in-out infinite;
}
.trophy-icon::before {
  content: '🏆'; font-size: 16px; position: absolute; top: 0; left: 0;
  filter: sepia(1) saturate(3) hue-rotate(320deg) brightness(0.8);
}


/* Now Playing */
.now-playing { display: flex; align-items: center; gap: 14px; z-index: 10; }
@keyframes vinylSpin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
.vinyl-wrap { position: relative; width: 140px; height: 140px; flex-shrink: 0; }
.vinyl {
  width: 140px; height: 140px; border-radius: 50%;
  box-shadow: 0 0 18px rgba(136,0,0,0.5), 0 0 4px rgba(0,0,0,0.9);
  animation: vinylSpin 4s linear infinite;
  position: relative; overflow: hidden; background: #111;
}
.vinyl-cover {
  position: absolute; top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  width: 54px; height: 54px;
  border-radius: 50%; object-fit: cover;
  pointer-events: none; z-index: 2;
}
.vinyl::before {
  content: ''; position: absolute; inset: 0; border-radius: 50%;
  background: repeating-radial-gradient(circle at center, transparent 0px, transparent 3px, rgba(0,0,0,0.35) 3px, rgba(0,0,0,0.35) 4px);
  z-index: 1;
}
.vinyl::after {
  content: ''; position: absolute; inset: 0; border-radius: 50%;
  background: radial-gradient(circle at center, transparent 36%, rgba(0,0,0,0.0) 37%, rgba(0,0,0,0.5) 90%, rgba(0,0,0,0.85) 100%);
  z-index: 3;
}
.vinyl-hole {
  position: absolute; top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  width: 10px; height: 10px; border-radius: 50%; background: #000; z-index: 4;
}
.now-playing-info { display: flex; flex-direction: column; gap: 4px; }
.now-playing-label { font-size: 9px; letter-spacing: 4px; color: #aa3333; }
.now-playing-track { font-size: 16px; font-weight: bold; letter-spacing: 2px; color: #fff; text-shadow: 0 0 8px rgba(255,255,255,0.3); }
.now-playing-artist { font-size: 12px; letter-spacing: 2px; color: #aaa; }

@media (max-width: 600px) {
  /* Header: stack logo above vinyl on mobile */
  .site-header {

  }

    justify-content: center !important;
    overflow: hidden !important;
  }
  /* Keep tab icons from blowing out tab width */
  .boombox-container, .boombox { width: 34px !important; height: 22px !important; margin-right: 4px !important; }
  .cube-front, .cube-back, .cube-top, .cube-bottom { width: 34px !important; height: 22px !important; }
  .cube-left, .cube-right { width: 22px !important; height: 22px !important; }
  .paintbrush { width: 14px !important; height: 26px !important; }

  }
  /* CONDEMNED spans both columns */
  .art-item[style*="grid-column"] { grid-column: 1 / -1 !important; }

  /* Top 10 title: allow wrapping, smaller font */
  .top10-title {

  /* Panel content full width on mobile */

  /* Tabs: smaller on mobile */

}
</style>

<script>
const canvas = document.getElementById('grayscaleCanvas');
const ctx = canvas.getContext('2d');

function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
resizeCanvas();
// resize handled in placeEyes listener

// ── Grid ─────────────────────────────────────────────────
const GRID_SIZE = 40;
const BASE_COLOR = 'rgba(136, 0, 0,';

function drawGrid(timestamp) {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    const pulse = 0.08 + (Math.sin(timestamp / 2000) * 0.5 + 0.5) * 0.10;
    ctx.strokeStyle = `${BASE_COLOR} ${pulse})`;
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (let x = 0; x <= canvas.width; x += GRID_SIZE) {
        ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height);
    }
    for (let y = 0; y <= canvas.height; y += GRID_SIZE) {
        ctx.moveTo(0, y); ctx.lineTo(canvas.width, y);
    }
    ctx.stroke();
    const dotPulse = 0.1 + (Math.sin(timestamp / 1500 + 1) * 0.5 + 0.5) * 0.15;
    ctx.fillStyle = `rgba(180, 0, 0, ${dotPulse})`;
    for (let x = 0; x <= canvas.width; x += GRID_SIZE) {
        for (let y = 0; y <= canvas.height; y += GRID_SIZE) {
            ctx.beginPath();
            ctx.arc(x, y, 1.5, 0, Math.PI * 2);
            ctx.fill();
        }
    }
}

// ── Eyes ─────────────────────────────────────────────────
const eyePairs = [];

function makeEye(x, y, size, blinkOffset) {
    return {
        x, y, size,
        glowIntensity: 0.7 + Math.random() * 0.3,
        nextBlink: blinkOffset,
        blinkTimer: 0,
        isBlinking: false,
        blinkDuration: 150 + Math.random() * 100
    };
}

function placeEyes() {
    eyePairs.length = 0;
    const W = canvas.width;
    const H = canvas.height;

    const cardW = Math.min(W * 0.95, 1400);
    const cardLeft  = (W - cardW) / 2;
    const cardRight = cardLeft + cardW;

    const rows = 8;
    const size = 24;
    const rowH = H / rows;

    // Spread eyes over full document height so they cover long pages
    const docH = Math.max(document.body.scrollHeight, H);
    const totalRows = Math.max(rows, Math.ceil(docH / rowH));

    // Zigzag: alternate between two x positions per side
    function addSide(xA, xB) {
        for (let r = 0; r < totalRows; r++) {
            const x = (r % 2 === 0) ? xA : xB;
            const y = rowH * r + rowH / 2;
            eyePairs.push(makeEye(x, y, size, 1000 + Math.random() * 6000));
        }
    }

    // Left gutter zigzag
    const leftMid = cardLeft / 2;
    addSide(leftMid - cardLeft * 0.18, leftMid + cardLeft * 0.18);

    // Right gutter zigzag
    const rightMid = cardRight + (W - cardRight) / 2;
    const rw = (W - cardRight);
    addSide(rightMid - rw * 0.18, rightMid + rw * 0.18);
}

placeEyes();
window.addEventListener('resize', () => { resizeCanvas(); placeEyes(); });
window.addEventListener('scroll', () => { /* canvas is fixed; eyes offset by scrollY in draw */ });

// Re-run placeEyes whenever document height changes (e.g. modals, expanding content)
let _lastDocH = document.body.scrollHeight;
new ResizeObserver(() => {
    const h = document.body.scrollHeight;
    if (h !== _lastDocH) { _lastDocH = h; placeEyes(); }
}).observe(document.body);

function drawBerserkMark(cx, cy, r, alpha) {
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.strokeStyle = 'rgba(5, 0, 0, 1)';
    ctx.fillStyle = 'rgba(5, 0, 0, 1)';
    ctx.lineWidth = r * 0.13;
    ctx.lineJoin = 'miter';
    ctx.miterLimit = 10;

    // The mark is taller than wide — scale vertically
    const w = r * 0.75;   // half-width of diamonds
    const dh = r * 0.55;  // half-height of each diamond

    // Centre dividing point between the two diamonds
    const mid = cy;
    // Top diamond — inverted (point up, wide in middle, point down at mid)
    const topTip  = mid - dh * 1.85; // top point
    const topMidY = mid - dh * 0.55; // widest point
    const topBot  = mid;             // bottom point (shared with bottom diamond top)

    // Bottom diamond — normal (point up at mid, wide in middle, point down)
    const botTop  = mid;
    const botMidY = mid + dh * 0.85;
    const botTip  = mid + dh * 1.85;

    // Draw top diamond outline — open at top (no line across the top point)
    ctx.beginPath();
    ctx.moveTo(cx - w, topMidY);
    ctx.lineTo(cx, topBot);
    ctx.lineTo(cx + w, topMidY);
    ctx.stroke();

    // Draw bottom diamond outline
    ctx.beginPath();
    ctx.moveTo(cx, botTop);
    ctx.lineTo(cx + w, botMidY);
    ctx.lineTo(cx, botTip);
    ctx.lineTo(cx - w, botMidY);
    ctx.closePath();
    ctx.stroke();

    // Top section: two lines from center outward + horn extensions from wide points
    ctx.lineWidth = r * 0.08;
    // Left diagonal from center to wide point
    ctx.beginPath();
    ctx.moveTo(cx, topBot);
    ctx.lineTo(cx - w, topMidY);
    ctx.stroke();
    // Right diagonal from center to wide point
    ctx.beginPath();
    ctx.moveTo(cx, topBot);
    ctx.lineTo(cx + w, topMidY);
    ctx.stroke();
    // Left horn: short extension upward and inward from wide point
    ctx.beginPath();
    ctx.moveTo(cx - w, topMidY);
    ctx.lineTo(cx - w * 0.55, topTip + (topMidY - topTip) * 0.45);
    ctx.stroke();
    // Right horn: short extension upward and inward from wide point
    ctx.beginPath();
    ctx.moveTo(cx + w, topMidY);
    ctx.lineTo(cx + w * 0.55, topTip + (topMidY - topTip) * 0.45);
    ctx.stroke();

    // Diagonal cross lines through bottom diamond
    ctx.lineWidth = r * 0.08;
    ctx.beginPath();
    ctx.moveTo(cx - w, botMidY);
    ctx.lineTo(cx, botTop);
    ctx.moveTo(cx + w, botMidY);
    ctx.lineTo(cx, botTop);
    ctx.moveTo(cx - w, botMidY);
    ctx.lineTo(cx, botTip);
    ctx.moveTo(cx + w, botMidY);
    ctx.lineTo(cx, botTip);
    ctx.stroke();

    // Central vertical spine
    ctx.lineWidth = r * 0.09;
    ctx.beginPath();
    ctx.moveTo(cx, botTip);
    ctx.lineTo(cx, topTip - r * 0.05);
    ctx.stroke();

    // Triple fork at top — center spike + two side prongs
    const forkBase = topTip + r * 0.18;
    const forkLen  = r * 0.38;
    const forkSpread = r * 0.28;
    ctx.lineWidth = r * 0.07;
    ctx.lineCap = 'round';
    // Center prong
    ctx.beginPath();
    ctx.moveTo(cx, forkBase);
    ctx.lineTo(cx, forkBase - forkLen);
    ctx.stroke();
    // Left prong
    ctx.beginPath();
    ctx.moveTo(cx, forkBase);
    ctx.lineTo(cx - forkSpread, forkBase - forkLen * 0.7);
    ctx.stroke();
    // Right prong
    ctx.beginPath();
    ctx.moveTo(cx, forkBase);
    ctx.lineTo(cx + forkSpread, forkBase - forkLen * 0.7);
    ctx.stroke();

    ctx.globalAlpha = 1;
    ctx.restore();
}

function drawEye(x, y, size, openAmount, glowIntensity) {
    if (openAmount < 0.02) return;
    const w = size * 2.4;
    const h = size * 1.1 * openAmount;

    ctx.save();

    // Ominous outer dark halo
    const halo = ctx.createRadialGradient(x, y, size * 0.5, x, y, size * 4.5);
    halo.addColorStop(0, `rgba(80, 0, 0, ${0.22 * glowIntensity})`);
    halo.addColorStop(0.5, `rgba(30, 0, 0, ${0.12 * glowIntensity})`);
    halo.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = halo;
    ctx.beginPath();
    ctx.ellipse(x, y, size * 4.5, size * 4.5, 0, 0, Math.PI * 2);
    ctx.fill();

    // Eye socket shadow
    const socket = ctx.createRadialGradient(x, y, size * 0.8, x, y, size * 2.5);
    socket.addColorStop(0, 'rgba(0,0,0,0)');
    socket.addColorStop(1, `rgba(0, 0, 0, ${0.7 * glowIntensity})`);
    ctx.fillStyle = socket;
    ctx.beginPath();
    ctx.ellipse(x, y, size * 2.5, size * 1.8, 0, 0, Math.PI * 2);
    ctx.fill();

    // Clip to eye opening shape
    ctx.beginPath();
    ctx.moveTo(x - w/2, y);
    ctx.bezierCurveTo(x - w/2 + w*0.1, y - h * 1.1, x + w/2 - w*0.1, y - h * 1.1, x + w/2, y);
    ctx.bezierCurveTo(x + w/2 - w*0.1, y + h * 0.7, x - w/2 + w*0.1, y + h * 0.7, x - w/2, y);
    ctx.closePath();
    ctx.clip();

    // Sclera — yellowed, diseased
    const scleraGrad = ctx.createRadialGradient(x, y, 0, x, y, w * 0.6);
    scleraGrad.addColorStop(0,   `rgba(210, 195, 160, ${glowIntensity})`);
    scleraGrad.addColorStop(0.5, `rgba(190, 165, 130, ${glowIntensity})`);
    scleraGrad.addColorStop(1,   `rgba(150, 110, 90, ${glowIntensity})`);
    ctx.fillStyle = scleraGrad;
    ctx.fillRect(x - w, y - h * 2, w * 2, h * 4);

    // Iris — deep amber-to-red
    const irisR = size * 0.58;
    const irisGrad = ctx.createRadialGradient(x, y, 0, x, y, irisR);
    irisGrad.addColorStop(0,    `rgba(200, 60, 0, ${glowIntensity})`);
    irisGrad.addColorStop(0.25, `rgba(160, 20, 0, ${glowIntensity})`);
    irisGrad.addColorStop(0.6,  `rgba(100, 5, 0, ${glowIntensity})`);
    irisGrad.addColorStop(0.85, `rgba(60, 0, 0, ${glowIntensity})`);
    irisGrad.addColorStop(1,    `rgba(20, 0, 0, ${glowIntensity})`);
    ctx.beginPath();
    ctx.arc(x, y, irisR, 0, Math.PI * 2);
    ctx.fillStyle = irisGrad;
    ctx.fill();

    // Iris radial lines
    for (let i = 0; i < 18; i++) {
        const a = (i / 18) * Math.PI * 2;
        ctx.beginPath();
        ctx.moveTo(x + Math.cos(a) * irisR * 0.28, y + Math.sin(a) * irisR * 0.28);
        ctx.lineTo(x + Math.cos(a) * irisR * 0.92, y + Math.sin(a) * irisR * 0.92);
        ctx.strokeStyle = `rgba(180, 30, 0, ${0.18 * glowIntensity})`;
        ctx.lineWidth = 0.5;
        ctx.stroke();
    }

    // Berserk brand inside iris
    drawBerserkMark(x, y, irisR * 0.62, glowIntensity * 0.85);

    // Round pupil — red glow emanating from center
    const pupilR = irisR * 0.22;
    ctx.beginPath();
    ctx.arc(x, y, pupilR, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(2, 0, 0, ${glowIntensity})`;
    ctx.fill();

    // Pupil red glow
    const pGlow = ctx.createRadialGradient(x, y, 0, x, y, pupilR * 2.5);
    pGlow.addColorStop(0, `rgba(255, 30, 0, ${0.5 * glowIntensity})`);
    pGlow.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = pGlow;
    ctx.beginPath();
    ctx.arc(x, y, pupilR * 2.5, 0, Math.PI * 2);
    ctx.fill();

    // Catchlight
    ctx.beginPath();
    ctx.arc(x - size * 0.15, y - size * 0.18, size * 0.055, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(255, 220, 200, ${0.75 * glowIntensity})`;
    ctx.fill();

    ctx.restore();

    // Eyelids
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(x - w/2, y);
    ctx.bezierCurveTo(x - w/2 + w*0.1, y - h * 1.1, x + w/2 - w*0.1, y - h * 1.1, x + w/2, y);
    ctx.strokeStyle = `rgba(15, 0, 0, ${glowIntensity})`;
    ctx.lineWidth = 2.5;
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(x - w/2, y);
    ctx.bezierCurveTo(x - w/2 + w*0.1, y + h * 0.7, x + w/2 - w*0.1, y + h * 0.7, x + w/2, y);
    ctx.lineWidth = 1.5;
    ctx.stroke();

    // Upper crease
    ctx.beginPath();
    ctx.moveTo(x - w/2 - size*0.1, y - h * 0.3);
    ctx.bezierCurveTo(x - w/4, y - h * 1.6, x + w/4, y - h * 1.6, x + w/2 + size*0.1, y - h * 0.3);
    ctx.strokeStyle = `rgba(0, 0, 0, ${0.5 * glowIntensity})`;
    ctx.lineWidth = 3;
    ctx.stroke();

    // Lashes
    ctx.strokeStyle = `rgba(10, 0, 0, ${0.95 * glowIntensity})`;
    for (let i = 0; i < 11; i++) {
        const t = (i + 0.5) / 11;
        const lx = x - w/2 + t * w;
        const lidY = y - h * 1.1 * (1 - 4*(t-0.5)*(t-0.5));
        const spread = (t - 0.5) * 0.9;
        const lashLen = size * (0.25 + Math.abs(t - 0.5) * 0.3);
        ctx.lineWidth = 1 + Math.abs(t - 0.5);
        ctx.beginPath();
        ctx.moveTo(lx, lidY);
        ctx.lineTo(lx + Math.sin(spread) * lashLen * 0.4,
                   lidY - Math.cos(spread * 0.3) * lashLen * openAmount);
        ctx.stroke();
    }
    ctx.restore();
}

function drawEyePairs(timestamp, dt) {
    for (let p of eyePairs) {
        p.blinkTimer += dt;
        let openAmount = 1;
        if (!p.isBlinking) {
            if (p.blinkTimer >= p.nextBlink) {
                p.isBlinking = true;
                p.blinkTimer = 0;
            }
        } else {
            const half = p.blinkDuration / 2;
            openAmount = p.blinkTimer < half
                ? 1 - (p.blinkTimer / half)
                : (p.blinkTimer - half) / half;
            if (p.blinkTimer >= p.blinkDuration) {
                p.isBlinking = false;
                p.blinkTimer = 0;
                p.nextBlink = 2000 + Math.random() * 7000;
            }
        }
        openAmount = Math.max(0.01, openAmount);
        // Offset y by scrollY so eyes stay fixed on screen as page scrolls
        const screenY = p.y - window.scrollY;
        // Only draw if eye is within viewport (performance)
        if (screenY > -p.size * 3 && screenY < canvas.height + p.size * 3) {
            drawEye(p.x, screenY, p.size, openAmount, p.glowIntensity);
        }
    }
}

// ── Main loop ─────────────────────────────────────────────
let lastTime = 0;
function drawAll(timestamp) {
    const dt = timestamp - lastTime;
    lastTime = timestamp;
    drawGrid(timestamp);
    drawEyePairs(timestamp, dt);
    requestAnimationFrame(drawAll);
}

drawAll(0);
</script>



<script>
const logoEl = document.querySelector(".site-header > a img");
const GLOW_DUR = 3000;
const GLITCH_DUR = 4000;
const now = Date.now();

if (!sessionStorage.getItem("animStart")) {
  sessionStorage.setItem("animStart", now);
}

const animStart = parseInt(sessionStorage.getItem("animStart"));
const elapsed = now - animStart;

// Negative delay jumps the animation to the right point in the cycle
const glowDelay   = -((elapsed % GLOW_DUR) / 1000).toFixed(3);
const glitchDelay = -((elapsed % GLITCH_DUR) / 1000).toFixed(3);

if (!sessionStorage.getItem("logofadedone")) {
  logoEl.style.animation = "fadeIn 1.2s ease-out, pulseGlow 3s ease-in-out infinite, glitch 4s infinite";
  logoEl.style.animationDelay = "0s, " + glowDelay + "s, " + glitchDelay + "s";
  sessionStorage.setItem("logofadedone", "1");
} else {
  logoEl.style.animation = "pulseGlow 3s ease-in-out infinite, glitch 4s infinite";
  logoEl.style.animationDelay = glowDelay + "s, " + glitchDelay + "s";
}

// ── Card & float animation sync (same session clock as logo) ──
const CARDGLOW_DUR  = 4000;
const CARDFLOAT_DUR = 6000;
const cardEl    = document.getElementById('mainCard');
const wrapperEl = document.getElementById('mainWrapper');

const cardGlowDelay  = -((elapsed % CARDGLOW_DUR)  / 1000).toFixed(3);
const cardFloatDelay = -((elapsed % CARDFLOAT_DUR) / 1000).toFixed(3);

cardEl.style.animation      = 'cardglow 4s ease-in-out infinite alternate';
cardEl.style.animationDelay = cardGlowDelay + 's';

wrapperEl.style.animation      = 'pageFadeIn 0.25s ease-out, cardfloat 6s ease-in-out infinite alternate';
wrapperEl.style.animationDelay = '0s, ' + cardFloatDelay + 's';

// ── Vinyl spin sync ──
const vinylEl = document.querySelector('.vinyl');
if (vinylEl) {
  const VINYL_DUR = 4000;
  const vinylElapsed = Date.now() - parseInt(sessionStorage.getItem("animStart") || Date.now());
  const vinylDelay = -((vinylElapsed % VINYL_DUR) / 1000).toFixed(3);
  vinylEl.style.animationDelay = vinylDelay + 's';
}
</script>
